# Creates one task through the real UI — capture, Organize, schedule sheet — and returns to Home.
#
# This is the workhorse the placement matrix calls once per row, so it is parameterised rather
# than copied. Every step goes through the controls a person uses; nothing is seeded through the
# API, because "which screen does this land on" is precisely what must not be short-circuited.
#
# env:
#   TITLE   required. The task's name. Keep it unique per flow — assertions match on it.
#   TYPE    "Focus Task" (default) | "Reminder Task"
#   WHEN    "" (skip the sheet entirely) | "Anytime" | "Today" | "Tomorrow"
#   REPEAT  "" (leave alone) | "No" | "Daily" | "Weekly" | "Monthly" | "Yearly"
#   NOTIFY  "" (leave it as the sheet sets it) | "Off" | "On the day" | "The day before" | "A week before"
#
# Since 2026-11-26 a day brings its own reminder - 9 AM on the day, or the next full hour once that
# has gone - so "" on a dated task is NOT silent. "Off" turns it off. "On the day" makes sure there
# is one (on an undated task that is "Remind me daily"). The earlier ones are added from "Change".
appId: com.mactora.taskManager
---
# The docked Ferne button. Labelled "Capture tasks" and role=button; it is NOT a tab, it pushes
# the Capture route (MainTabs.tsx).
- tapOn: "Capture tasks"
- extendedWaitUntil:
    visible: "Task name"
    timeout: 20000

# Capture's field and Organize's per-draft field share the accessibility label "Task name", and
# Capture stays mounted underneath Organize. Here only Capture is on screen, so index 0 is safe.
- tapOn:
    text: "Task name"
    index: 0
- inputText: "${TITLE}"

# The label carries a count — "Confirm & Organize (1)" — so match on the stable prefix.
- tapOn:
    text: "Confirm & Organize.*"
- extendedWaitUntil:
    visible: "Organize your tasks"
    timeout: 20000

- runFlow:
    when:
      true: ${TYPE === "Reminder Task"}
    commands:
      - tapOn: "Reminder Task"

- runFlow:
    when:
      true: ${(WHEN || "") !== "" || (REPEAT || "") !== "" || (NOTIFY || "") !== ""}
    commands:
      - tapOn: "Set a schedule"
      - extendedWaitUntil:
          visible: "When will you do it\\?"
          timeout: 20000

      - runFlow:
          when:
            true: ${(WHEN || "") !== ""}
          commands:
            - tapOn: "${WHEN}"

      # Repeat is refused without a day, by design — a rule with nothing to repeat from is
      # rejected at both create and update. So this only runs when a date was chosen.
      - runFlow:
          when:
            true: ${(REPEAT || "") !== ""}
          commands:
            - tapOn: "${REPEAT}"

      # The reminder card is one line until "Change". With no reminder its button is "Add one"
      # (dated) or "Remind me daily" (undated); any reminder at all makes it "Change".
      - runFlow:
          when:
            true: ${(NOTIFY || "") !== "" && (NOTIFY || "") !== "Off"}
          commands:
            - runFlow:
                when:
                  visible: "Add one"
                commands:
                  - tapOn: "Add one"
            - runFlow:
                when:
                  visible: "Remind me daily"
                commands:
                  - tapOn: "Remind me daily"

      - runFlow:
          when:
            true: ${(NOTIFY || "") === "The day before" || (NOTIFY || "") === "A week before"}
          commands:
            - tapOn: "Change"
            - tapOn: "\\+ ${NOTIFY}"
            - tapOn: "Done"

      - runFlow:
          when:
            true: ${(NOTIFY || "") === "Off"}
          commands:
            - runFlow:
                when:
                  visible: "Change"
                commands:
                  - tapOn: "Change"
                  - tapOn: "Turn off reminders"

      - tapOn: "Save schedule"
      - extendedWaitUntil:
          visible: "Organize your tasks"
          timeout: 20000

# "Confirm & Add 1 task" / "Confirm & Add 2 tasks" — match the stable prefix.
- tapOn:
    text: "Confirm & Add.*"
- extendedWaitUntil:
    visible: "TO DO"
    timeout: 30000
